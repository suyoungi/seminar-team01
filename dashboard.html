<style>
/* ---------- 색·글꼴 토큰 (dataviz 기본 팔레트, 검증본) ---------- */
:root {
  color-scheme: light;
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --line: #e3e6ea; --line-2: #cfd4da;
  --ink: #0f172a; --ink-2: #475569; --ink-3: #7c8794;
  --brand: #1e3a8a; --brand-soft: #e8eefb; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --q100:#cde2fb; --q150:#b7d3f6; --q200:#9ec5f4; --q250:#86b6ef; --q300:#6da7ec; --q350:#5598e7; --q400:#3987e5; --q450:#2a78d6; --q500:#256abf; --q550:#1c5cab; --q600:#184f95; --q650:#104281; --q700:#0d366b;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-bg:#e4f6e4; --warn-bg:#fff3d6; --serious-bg:#fde7dd; --critical-bg:#fbe1e1; --neutral-bg:#eceff3; --neutral:#5b6572;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.05);
  --radius: 14px;
  --font: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#131416; --surface:#1a1b1e; --surface-2:#222327; --line:#2c2e33; --line-2:#3b3e45;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f948f;
    --brand:#9fb6f0; --brand-soft:#1f2a44; --accent:#3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-bg:#15301a; --warn-bg:#3a2d0c; --serious-bg:#3c2217; --critical-bg:#3b1a1a; --neutral-bg:#2a2d33; --neutral:#aab2bd;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#131416; --surface:#1a1b1e; --surface-2:#222327; --line:#2c2e33; --line-2:#3b3e45;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f948f;
  --brand:#9fb6f0; --brand-soft:#1f2a44; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-bg:#15301a; --warn-bg:#3a2d0c; --serious-bg:#3c2217; --critical-bg:#3b1a1a; --neutral-bg:#2a2d33; --neutral:#aab2bd;
  --shadow: none;
}

/* ---------- 기본 ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65; font-size: 15.5px; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.3; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.tiny { font-size: .8rem; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 머리 ---------- */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; }
.logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.logo .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .9rem; letter-spacing: .02em; }
.logo .t { font-weight: 700; font-size: 1.02rem; }
.logo .t small { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-3); line-height: 1.2; }
nav.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { padding: 7px 11px; border-radius: 9px; color: var(--ink-2); font-size: .9rem; white-space: nowrap; }
nav.tabs a:hover { background: var(--surface-2); text-decoration: none; }
nav.tabs a.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.hdr-tools { display: flex; gap: 6px; align-items: center; }
.hdr-tools .asof { font-size: .78rem; color: var(--ink-3); white-space: nowrap; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 9px; padding: 6px 10px; font-size: .82rem; white-space: nowrap; }
.iconbtn:hover { background: var(--surface-2); }
@media (max-width: 1100px) { .hdr-tools .asof { display: none; } }
@media (max-width: 760px) { .logo .t small { display: none; } header.top .wrap { gap: 8px; } }

/* ---------- 본문 공통 ---------- */
main { padding: 28px 0 80px; }
section.view { display: none; }
section.view.on { display: block; }
body.print-all section.view { display: block; margin-bottom: 48px; page-break-before: always; }
.view-head { margin-bottom: 18px; }
.view-head .eyebrow { font-size: .78rem; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.view-head h2 { font-size: 1.55rem; margin: 4px 0 6px; }
.view-head .lead { color: var(--ink-2); max-width: 820px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 960px) { .g4 { grid-template-columns: repeat(2,1fr); } .g3 { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } body { font-size: 15px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
.card h3 { font-size: 1.02rem; margin-bottom: 10px; }
.card h3 .sub { font-weight: 400; color: var(--ink-3); font-size: .85rem; margin-left: 6px; }
.kpi .label { font-size: .84rem; color: var(--ink-2); }
.kpi .value { font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 2px; }
.kpi .unit { font-size: 1rem; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.kpi .plain { font-size: .86rem; color: var(--ink-2); margin-top: 6px; }
.kpi .src { margin-top: 10px; }
.howto { border-left: 4px solid var(--accent); background: var(--brand-soft); border-radius: 10px; padding: 12px 16px; margin: 14px 0 0; display: flex; gap: 12px; align-items: flex-start; }
.howto b { color: var(--brand); white-space: nowrap; }
.howto p { color: var(--ink); }
.note { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: .9rem; color: var(--ink-2); }
.stack > * + * { margin-top: 16px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

/* 배지: 상태색 + 글자. 색만으로 뜻을 전하지 않음 */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; vertical-align: 1px; white-space: nowrap; line-height: 1.5; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--good-bg); color: var(--good); }
.badge.sec { background: var(--warn-bg); color: #8a5a00; }
.badge.guess { background: var(--serious-bg); color: #a7431e; }
.badge.todo { background: var(--critical-bg); color: var(--critical); }
.badge.plan { background: var(--neutral-bg); color: var(--neutral); }
.badge.info { background: var(--brand-soft); color: var(--brand); }
.badge.mine { background: var(--brand-soft); color: var(--brand); }
:root[data-theme="dark"] .badge.sec, :root:not([data-theme="light"]) .badge.sec { color: #f3c45a; }
:root[data-theme="dark"] .badge.guess, :root:not([data-theme="light"]) .badge.guess { color: #f2a07e; }
.badge.lg { font-size: .8rem; padding: 3px 10px; }

/* 표 */
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .78rem; color: var(--ink-3); font-weight: 700; letter-spacing: .03em; background: var(--surface-2); position: sticky; top: 60px; }
.tbl tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.tbl-wrap { overflow-x: auto; }

/* 버튼·칩 */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-size: .9rem; font-weight: 600; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: .84rem; }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
.toolbar .spacer { flex: 1; }

/* 툴팁 */
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .82rem; padding: 7px 10px; border-radius: 8px; max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.2); opacity: 0; transition: opacity .08s; line-height: 1.45; }
#tip.on { opacity: 1; }

/* 그래프 공통 */
svg.chart { width: 100%; height: auto; display: block; font-family: var(--font); }
svg.chart text { fill: var(--ink-2); font-size: 12px; }
svg.chart .axis { stroke: var(--line-2); stroke-width: 1; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .lbl { fill: var(--ink); font-weight: 600; }
svg.chart .hit { fill: transparent; }
figure { margin: 0; }
figcaption { font-size: .82rem; color: var(--ink-3); margin-top: 8px; }

/* 홈 */
.hero { background: linear-gradient(135deg, var(--brand) 0%, #27489f 55%, #2a78d6 100%); color: #fff; border-radius: 18px; padding: 34px 36px; position: relative; overflow: hidden; }
.hero h1 { font-size: 1.75rem; font-weight: 800; max-width: 760px; letter-spacing: -.02em; }
.hero p { margin-top: 10px; max-width: 760px; opacity: .92; font-size: 1.02rem; }
.hero .meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.hero .meta span { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px 11px; font-size: .8rem; }
.steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 16px; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; display: grid; place-items: center; font-size: .85rem; margin-bottom: 8px; }
.step b { display: block; margin-bottom: 4px; }
.step p { font-size: .9rem; color: var(--ink-2); }
.order { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
@media (max-width: 960px) { .order { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 640px) { .order { grid-template-columns: 1fr 1fr; } }
.order a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); }
.order a:hover { border-color: var(--accent); text-decoration: none; }
.order a .k { font-size: .74rem; color: var(--ink-3); font-weight: 700; }
.order a .t { font-weight: 700; display: block; margin: 2px 0; }
.order a .d { font-size: .82rem; color: var(--ink-2); }
.ask-banner { display: flex; align-items: center; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; }
.ask-banner .txt { flex: 1; }
.ask-banner b { font-size: 1.05rem; }
.ask-banner p { color: var(--ink-2); font-size: .92rem; margin-top: 3px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: .86rem; color: var(--ink-2); }
.legend-row span { display: inline-flex; gap: 6px; align-items: center; }

/* 제도 지도 */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.inst-card { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line-2)); border-radius: 12px; padding: 16px 18px; color: var(--ink); box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
.inst-card:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--c); }
.inst-card .top { display: flex; justify-content: space-between; align-items: center; }
.inst-card .no { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: .78rem; font-weight: 800; }
.inst-card h4 { font-size: 1rem; }
.inst-card .plain { font-size: .88rem; color: var(--ink-2); flex: 1; }
.inst-card .facts { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.inst-card .more { font-size: .82rem; color: var(--accent); font-weight: 600; }
.owner { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--ink-2); }
.owner::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.detail-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.field { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field .fk { font-size: .82rem; font-weight: 700; color: var(--ink-3); padding-top: 2px; }
.field .fv { font-size: .92rem; }
@media (max-width: 600px) { .field { grid-template-columns: 1fr; gap: 2px; } }
ul.tl { list-style: none; padding: 0; margin: 0; }
ul.tl li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
ul.tl li:last-child { border-bottom: 0; }
ul.tl .d { color: var(--ink-3); font-size: .8rem; min-width: 64px; }

/* 채택 매트릭스 */
table.mx { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: .8rem; }
.mx th { font-weight: 700; color: var(--ink-2); font-size: .76rem; padding: 4px 6px; vertical-align: bottom; text-align: center; }
.mx thead th span { display: inline-block; max-width: 92px; line-height: 1.25; }
.mx .mx-rowh { text-align: right; white-space: nowrap; color: var(--ink); padding-right: 10px; }
.mx-cell { height: 46px; border-radius: 7px; text-align: center; cursor: pointer; transition: transform .1s; line-height: 1.2; vertical-align: middle; }
.mx-cell.empty { background: var(--surface-2); cursor: default; opacity: .55; }
.mx-cell:not(.empty):hover { transform: scale(1.04); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.mx-cell .f { display: block; font-weight: 700; }
.mx-cell .c { display: block; font-size: .68rem; opacity: .85; }
.legend-row .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
ul.bul { margin: 0; padding-left: 18px; font-size: .9rem; }
ul.bul li { margin: 6px 0; }

/* 빈 화면 안내 */
.placeholder { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 36px; text-align: center; color: var(--ink-3); }
.err { border: 1px solid var(--critical); background: var(--critical-bg); color: var(--critical); border-radius: 12px; padding: 14px 16px; }
.err code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }

footer { border-top: 1px solid var(--line); padding: 22px 0; font-size: .82rem; color: var(--ink-3); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; }

@media print {
  header.top, .hdr-tools, .toolbar, .ask-banner, #tip, .no-print { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  section.view { display: block !important; page-break-before: always; }
  section.view:first-of-type { page-break-before: auto; }
  .card { box-shadow: none; break-inside: avoid; }
  .hero { color: #000; background: #eef2fb; }
  a { color: inherit; }
}
</style>
</head>

const DATA = {};
const B_PAGES = 'https://minkwanchoi.github.io/seminar-team01/';
const OVERLAP_FILES = ['overlap_summary.csv', 'overlap_pairs.csv', 'overlap_common.csv', 'overlap_reference.csv'];
const VIEWS = [
  { id: 'home',         tab: '홈',           title: '문제 한 장' },
  { id: 'institutions', tab: '제도 지도',     title: '제도 9개 지도' },

/* CSV 읽기(따옴표 처리) */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length > 1 || (r[0] && r[0].trim())).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? '').trim()])));
}
async function getText(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status + ' ' + url); return r.text(); }
async function getJSON(url) { return JSON.parse(await getText(url)); }

async function loadAll() {

    getJSON(base + 'stakeholders.json'), getJSON(base + 'proposals.json'), getJSON(base + 'limits.json'),
    getJSON(base + 'glossary.json'), getJSON(base + 'qa.json'), getText(base + 'adoption.csv'),
  ]);
  Object.assign(DATA, { inst, rules, cases, sth, props, limits, gloss, qa, adoption: parseCSV(adoptionCsv), userRows: [] });
  // B의 겹침 CSV: 팀 저장소 → 없으면 B의 배포 페이지
  DATA.overlap = {}; DATA.overlapSource = null;
  for (const src of ['data/cwe/v4.20/', B_PAGES + 'data/cwe/v4.20/']) {
    try {
      const texts = await Promise.all(OVERLAP_FILES.map(f => getText(src + f)));
      OVERLAP_FILES.forEach((f, i) => DATA.overlap[f.replace('.csv', '')] = parseCSV(texts[i]));
      DATA.overlapSource = src.startsWith('http') ? 'B 배포 페이지' : '팀 저장소';
      break;
    } catch (e) { /* 다음 후보 */ }

/* 홈·물어보기·제언이 함께 쓰는 겹침 요약 숫자. B의 CSV에서 계산 */
function summarizeOverlap() {
  const o = DATA.overlap; if (!o.overlap_pairs) return null;
  const pair = o.overlap_pairs.find(r => r.set_a === '매뉴얼 보안약점 44' && r.set_b === '행안부 49');
  const top = o.overlap_reference.find(r => r.reference.startsWith('CWE Top 25'));
  const five = o.overlap_common.filter(r => r.n_sets === '5');
  return {
    common: +pair.intersection, union: +pair.union, jaccard: +pair.jaccard, size44: +pair.size_a, size49: +pair.size_b,
    pct44: Math.round(+pair.intersection / +pair.size_a * 100), pct49: Math.round(+pair.intersection / +pair.size_b * 100),
    top25: { size: +top.size, covered: +top.covered_domestic, pct: +top.pct_domestic, missing: top.missing_cwes.split(';').filter(Boolean) },
    five: five.map(r => r.cwe_id),
  };
}

const SVG = {

  hbar({ items, max, width = 640, barH = 22, gap = 8, color = 'var(--s1)', labelW = 150, valueFmt = v => fmt(v), unit = '' }) {
    const m = max ?? Math.max(...items.map(i => i.value), 1);
    const h = items.length * (barH + gap) + 6, plotW = width - labelW - 70;
    const bars = items.map((it, i) => {
      const y = i * (barH + gap) + 3, w = Math.max(0, it.value / m * plotW);
      return `<g data-tip="${esc(it.tip || (it.label + ': ' + valueFmt(it.value) + unit))}">
        <rect class="hit" x="0" y="${y - gap / 2}" width="${width}" height="${barH + gap}"/>
        <text x="${labelW - 10}" y="${y + barH / 2 + 4}" text-anchor="end" class="lbl">${esc(it.label)}</text>
        <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${it.color || color}"/>
        <text x="${labelW + w + 8}" y="${y + barH / 2 + 4}" class="num">${valueFmt(it.value)}${unit}</text></g>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${width} ${h}" role="img"><line class="axis" x1="${labelW}" y1="0" x2="${labelW}" y2="${h}"/>${bars}</svg>`;
  },
};

/* =========================================================

const GROUP_COLOR = { '국방': 'var(--s1)', '행정·공공': 'var(--s2)', '정보보안': 'var(--s3)', '품질': 'var(--s4)', '항공': 'var(--s5)', '내 입력': 'var(--s7)' };
const instState = { group: '전체', role: '전체' };

function allInstitutions() {

}
function ownerChip(inst) {
  return `<span class="owner" style="--c:${GROUP_COLOR[inst.owner_group] || 'var(--ink-3)'}">${esc(inst.owner)}</span>`;
}

    <div class="card kpi"><div class="label">다른 제도 결과를 인정하는 조항</div><div class="value">17<span class="unit">곳</span></div><div class="plain">인증서·도구·심사 생략 수준. 시험 결과 수준은 0곳</div><div class="src tiny">${badge('확인')} docs/A3</div></div>

    <textarea id="instCsv" rows="5" style="width:100%;margin:10px 0;font:13px/1.5 ui-monospace,monospace;border:1px solid var(--line-2);border-radius:8px;padding:8px;background:var(--surface-2);color:var(--ink)" placeholder="name,owner,role,plain,standard_family,standard_detail,form,confidence,domestic_addition,basis&#10;..."></textarea>
    <div class="toolbar"><input type="file" id="instFile" accept=".csv,text/csv"><button class="btn primary" id="instApply">추가</button><button class="btn" id="instClear">입력 비우기</button><span id="instMsg" class="small muted"></span></div>

  <hr class="sep">
  <div class="card">
    <h3>제·개정 연표 <span class="sub">제도마다 근거 규정이 언제 생기고 바뀌었나</span></h3>
    <figure>${timelineChart(DATA.inst.institutions)}<figcaption>그림 2. 점 하나가 제정·개정·시행 한 건. 색은 소관 기관의 분야. 채워진 점은 원문으로 확인한 날짜, 테두리만 있는 점은 2차 자료. 점에 마우스를 올리면 내용이 보입니다. 2024~2026년에 변경이 몰려 있는 것은 자료로 확인한 사실이고, 그 이유는 이 연구에서 다루지 않습니다.</figcaption></figure>

  $('#instGroups').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { instState.group = b.dataset.g; RENDER.institutions(sec); } });

  $('#instApply').addEventListener('click', () => { const msg = applyUserRows($('#instCsv').value); RENDER.institutions(sec); $('#instInput').style.display = 'block'; $('#instMsg').textContent = msg; });
  $('#instClear').addEventListener('click', () => { DATA.userRows = []; RENDER.institutions(sec); });
  $('#instExport').addEventListener('click', () => {
    const cols = ['no', 'name', 'owner', 'owner_group', 'role', 'plain', 'validity', 'basis', 'agency', 'target', 'items', 'standards', 'adoption', 'recognition'];
    download('제도_카드.csv', toCSV(allInstitutions(), cols), 'text/csv');

};

function instCard(i) {
  const roleBadge = i.mine ? badge('내 입력') : badge(i.quant ? '확인' : '기획안', i.role);
  return `<a class="inst-card" href="#/institutions/${esc(i.id)}" style="--c:${GROUP_COLOR[i.owner_group] || 'var(--ink-3)'}">
    <div class="top"><span class="no">${esc(i.no)}</span>${roleBadge}</div>
    <h4>${esc(i.name)}</h4>
    <p class="plain">${esc(i.plain)}</p>
    <div class="facts"><span>${ownerChip(i)}</span><span class="tiny">유효기간: ${i.validity ? rich(i.validity) : '입력 없음'}</span></div>
    <span class="more">자세히 →</span></a>`;
}

function applyUserRows(text) {
  if (!text.trim()) return '입력이 비어 있습니다.';
  const rows = parseCSV(text);
  const forms = new Set(DATA.rules.forms.map(f => f.key)), fams = new Set(DATA.rules.standard_families.map(s => s.key));
  const ok = [], bad = [];
  rows.forEach(r => {
    if (!r.name) return;
    if (!forms.has(r.form)) bad.push(`${r.name}: 기준에 없는 채택 형태 "${r.form}"`);
    else if (!fams.has(r.standard_family)) bad.push(`${r.name}: 기준에 없는 표준 계열 "${r.standard_family}"`);
    else ok.push(r);
  });
  DATA.userRows = [...DATA.userRows, ...ok];
  return `${ok.length}건 추가` + (bad.length ? ` · 건너뜀 ${bad.length}건 — ${bad.join(' / ')}` : '');
}

/* 연표: 가로 축 연도, 세로 줄 제도 */
function timelineChart(insts) {
  const events = insts.flatMap(i => i.timeline.map(t => ({ ...t, inst: i })));
  const years = events.map(e => +String(e.date).slice(0, 4));
  const y0 = Math.min(...years) - 1, y1 = Math.max(...years) + 1;
  const W = 960, labelW = 190, rowH = 30, top = 28, plotW = W - labelW - 30, H = top + insts.length * rowH + 20;
  const x = d => { const [y, m] = String(d).split('-'); return labelW + ((+y + ((+m || 6) - 1) / 12 - y0) / (y1 - y0)) * plotW; };
  const ticks = []; for (let y = y0 + 1; y < y1; y += (y1 - y0 > 12 ? 2 : 1)) ticks.push(y);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="제도별 제·개정 연표">
    ${ticks.map(y => `<line class="grid" x1="${x(y + '-01')}" y1="${top - 8}" x2="${x(y + '-01')}" y2="${H - 16}"/><text x="${x(y + '-01')}" y="${top - 12}" text-anchor="middle" style="font-size:11px">${y}</text>`).join('')}
    ${insts.map((i, r) => { const cy = top + r * rowH + rowH / 2; return `
      <line class="axis" x1="${labelW}" y1="${cy}" x2="${W - 30}" y2="${cy}" style="stroke:var(--line)"/>
      <text x="${labelW - 10}" y="${cy + 4}" text-anchor="end" class="lbl" style="font-size:12px">${esc(i.short)}</text>
      ${i.timeline.map(t => `<circle cx="${x(t.date)}" cy="${cy}" r="6" fill="${t.status === '확인' ? GROUP_COLOR[i.owner_group] : 'var(--surface)'}" stroke="${GROUP_COLOR[i.owner_group]}" stroke-width="2" data-tip="<b>${esc(i.short)} · ${esc(t.date)}</b><br>${esc(t.label)} (${esc(t.status)})"/>`).join('')}`; }).join('')}
  </svg>`;
}

  const adoptionRows = i.mine ? [] : DATA.adoption.filter(r => r.institution_id === i.id);

  const prev = all[idx - 1], next = all[idx + 1];
  sec.innerHTML = `

  <div class="detail-grid">

    </div>
    <div class="stack">
      <div class="card"><h3>이 제도의 연표</h3>${i.timeline.length ? `<ul class="tl">${i.timeline.map(t => `<li><span class="d num">${esc(t.date)}</span><span>${esc(t.label)}</span> ${badge(t.status)}</li>`).join('')}</ul>` : '<p class="muted small">입력 없음</p>'}</div>
      <div class="card"><h3>표준 채택 <span class="sub">매트릭스의 이 제도 행</span></h3>${adoptionRows.length ? `<table class="tbl"><tbody>${adoptionRows.map(r => `<tr><td>${esc(r.standard_family)}</td><td><b>${esc(r.form)}</b> ${badge(r.confidence)}</td></tr>`).join('')}</tbody></table><p class="tiny" style="margin-top:8px"><a href="#/adoption">매트릭스 전체 보기 →</a></p>` : (i.mine ? `<p class="small">${esc(i.standards)} → <b>${esc(DATA.userRows[+i.id.slice(4)].form)}</b></p>` : '<p class="muted small">해당 없음</p>')}</div>
      <div class="card"><h3>관련 이해관계자</h3>${related.length ? `<div class="chips">${related.map(s => `<a class="chip" href="#/stakeholders" data-tip="${esc(s.role)}">${esc(s.name)}</a>`).join('')}</div>` : '<p class="muted small">입력 없음</p>'}</div>

  </div>`;

/* =========================================================
   표준 채택 매트릭스: 제도 × 표준 격자 · 분포 · 표 보기
   ========================================================= */
/* 채택 형태 → 색. "얼마나 그대로 가져왔나"의 등급이라 한 가지 색(파랑)의 진하기로, 국내 기준은 주황 */
const FORM_STYLE = {
  '동일 채택':            { bg: 'var(--q600)', ink: '#fff', short: '동일' },
  '동일 채택 + 국내 추가': { bg: 'var(--q550)', ink: '#fff', short: '동일+추가' },
  '수정 채택':            { bg: 'var(--q450)', ink: '#fff', short: '수정' },
  '부분 채택':            { bg: 'var(--q350)', ink: '#fff', short: '부분' },
  '참조':                 { bg: 'var(--q200)', ink: 'var(--ink)', short: '참조' },
  '국내 추가':            { bg: 'var(--s2)', ink: '#fff', short: '국내 추가' },
  '국내 고유':            { bg: 'var(--s2)', ink: '#fff', short: '국내 고유' },
  '미채택':               { bg: 'var(--surface-2)', ink: 'var(--ink-3)', short: '—' },
};
const adoptState = { table: false, sel: null };

function adoptionRows() {
  const mine = DATA.userRows.map((r, i) => ({ institution_id: 'user' + i, institution_label: r.name, standard_family: r.standard_family, standard_detail: r.standard_detail, form: r.form, confidence: r.confidence, domestic_addition: r.domestic_addition, basis: r.basis, mine: true }));
  return [...DATA.adoption, ...mine];
}

RENDER.adoption = (sec) => {
  const rows = adoptionRows();
  const fams = DATA.rules.standard_families.map(s => s.key);

  const domestic = rows.filter(r => /국내/.test(r.form)).length;

  const cell = (lab, fam) => {
    const r = rows.find(x => x.institution_label === lab && x.standard_family === fam);

    return `<td class="mx-cell" style="background:${st.bg};color:${st.ink}" data-tip="${esc(tipHtml)}" data-lab="${esc(lab)}" data-fam="${esc(fam)}"><span class="f">${esc(st.short)}</span><span class="c">${esc(r.confidence)}</span></td>`;
  };

  sec.innerHTML = viewHead('2장 · 채택 형태', '표준 채택 매트릭스',
    '제도마다 국제·해외 표준을 어떤 방식으로 가져왔는지를 한 표로 놓았습니다. 가로는 참조 표준의 계열, 세로는 제도(또는 제도 안의 시험 갈래)입니다.',
    '칸의 파란색이 진할수록 국제표준을 그대로 가져온 것이고, 연할수록 이름만 참조한 것입니다. 주황색은 참조 표준 없이 국내에서 만든 기준입니다. 칸 아래 작은 글자는 그 판정을 원문으로 확인했는지(확인), 자료 없이 판단했는지(추정)입니다. 칸을 누르면 근거가 아래에 펼쳐집니다.') + `
  <div class="grid g4" style="margin-bottom:18px">
    <div class="card kpi"><div class="label">판정한 칸</div><div class="value">${rows.length}<span class="unit">개</span></div><div class="plain">제도 9개를 시험 갈래까지 나누면 ${labels.length}행</div></div>
    <div class="card kpi"><div class="label">원문으로 확인한 판정</div><div class="value">${Math.round(confirmed / rows.length * 100)}<span class="unit">%</span></div><div class="plain">${confirmed}/${rows.length}칸. 나머지는 추정 또는 기획안</div></div>
    <div class="card kpi"><div class="label">국제·해외 표준을 가져온 칸</div><div class="value">${intl}<span class="unit">개</span></div><div class="plain">동일·수정·부분 채택. 방식이 제도마다 다름</div></div>
    <div class="card kpi"><div class="label">국내에서 만든 기준</div><div class="value">${domestic}<span class="unit">개</span></div><div class="plain">국내 추가·국내 고유. 외국과 바로 맞춰 볼 수 없는 부분</div></div>
  </div>

  <div class="toolbar">
    <div class="legend-row" id="formLegend">${DATA.rules.forms.filter(f => f.key !== '미채택').map(f => { const st = FORM_STYLE[f.key]; return `<span data-tip="${esc(f.plain)}"><i class="sw" style="background:${st.bg}"></i>${esc(f.key)}</span>`; }).join('')}</div>
    <span class="spacer"></span>
    <button class="btn" id="adoptToggle">${adoptState.table ? '격자 보기' : '표 보기'}</button>
    <button class="btn" id="adoptExport">내보내기 CSV</button>
  </div>

  ${adoptState.table ? `
  <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>제도</th><th>표준 계열</th><th>표준 세부</th><th>채택 형태</th><th>확인</th><th>국내 추가 항목</th><th>근거</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.institution_label)}${r.mine ? ' ' + badge('내 입력') : ''}</td><td>${esc(r.standard_family)}</td><td>${esc(r.standard_detail)}</td><td><b>${esc(r.form)}</b></td><td>${badge(r.confidence)}</td><td>${esc(r.domestic_addition || '—')}</td><td class="small">${esc(r.basis)}</td></tr>`).join('')}</tbody></table></div>`
  : `
  <div class="card tbl-wrap" style="padding:12px">
    <table class="mx"><thead><tr><th class="mx-rowh"></th>${fams.map(f => `<th data-tip="${esc(famPlain[f])}"><span>${esc(f)}</span></th>`).join('')}</tr></thead>
    <tbody>${labels.map(lab => `<tr><th class="mx-rowh">${esc(lab)}${rows.find(r => r.institution_label === lab)?.mine ? ' ' + badge('내 입력') : ''}</th>${fams.map(f => cell(lab, f)).join('')}</tr>`).join('')}</tbody></table>
    <p class="tiny" style="margin-top:8px">표준 계열 이름에 마우스를 올리면 그 표준이 무엇인지 보입니다. 빈 칸은 그 제도가 그 계열을 쓰지 않는다는 뜻이 아니라, 이 연구에서 판정하지 않았다는 뜻입니다.</p>
  </div>
  <div id="adoptDetail" class="card" style="display:none;margin-top:14px"></div>`}

  <hr class="sep">
  <div class="grid g2">
    <div class="card"><h3>채택 형태별 개수 <span class="sub">판정 ${rows.length}칸</span></h3>
      ${SVG.hbar({ items: DATA.rules.forms.filter(f => byForm[f.key]).map(f => ({ label: f.key, value: byForm[f.key], color: FORM_STYLE[f.key].bg, tip: `${f.key}: ${byForm[f.key]}칸 — ${f.plain}` })), labelW: 160, width: 560, unit: '칸' })}
      <figcaption>그림 3. 국제표준을 그대로 쓰는 제도(동일 채택)는 암호모듈·CC처럼 국제 통용이 목적인 제도이고, 국방 신뢰성시험은 코딩규칙·CWE를 '부분 채택'하면서 44개 목록과 동적시험 등급표를 국내에서 따로 정했습니다.</figcaption></div>
    <div class="card"><h3>이 표에서 보려는 것</h3>
      <ul class="bul">
        <li>같은 CWE를 참조하는 제도(①②)가 서로 다른 선정 목록을 쓴다는 점. 겹침 크기는 <a href="#/overlap">겹침 탐색기</a>에서 확인 ${badge('확인')}</li>
        <li>국제표준을 그대로 채택해도 상호인정 협정이 없으면 결과가 인정되지 않는다는 점. KCMVP(④)는 미국·캐나다 CMVP와 같은 ISO/IEC 19790·24759를 쓰지만 상호인정 협정은 확인되지 않음 ${badge('확인 필요')}</li>
        <li>CC(⑤)는 국제용 인증만 CCRA로 가입국에서 통용되고, 국내용 인증은 국내에서만 효력이 있다는 점 ${badge('확인')} 고시 별표 2 · 국내용 효력은 ${badge('2차')}</li>
        <li>국내 추가 항목이 많은 제도(①)는 인정 통로 자체가 없다는 점 ${badge('추정')} 해외 사례의 "인정 규정이 따로 있어야 함"과 이어짐</li>
        <li>제도 사이에 결과·도구를 인정하는 조항이 이미 17곳 있지만, 신뢰성시험의 정적분석 결과를 다른 제도가 인정하는 조항은 없음 ${badge('확인')} docs/A3</li>
      </ul></div>
  </div>`;

  $('#adoptToggle').addEventListener('click', () => { adoptState.table = !adoptState.table; RENDER.adoption(sec); });
  $('#adoptExport').addEventListener('click', () => download('표준_채택_매트릭스.csv', toCSV(rows, ['institution_label', 'standard_family', 'standard_detail', 'form', 'confidence', 'domestic_addition', 'basis']), 'text/csv'));
  $$('.mx-cell[data-lab]', sec).forEach(td => td.addEventListener('click', () => {
    const r = rows.find(x => x.institution_label === td.dataset.lab && x.standard_family === td.dataset.fam);
    const d = $('#adoptDetail'); d.style.display = 'block';
    const f = DATA.rules.forms.find(x => x.key === r.form);
    d.innerHTML = `<h3>${esc(r.institution_label)} × ${esc(r.standard_family)} <span class="sub">${badge(r.confidence)}</span></h3>
      <div class="field"><div class="fk">참조 표준</div><div class="fv">${esc(r.standard_detail)}</div></div>
      <div class="field"><div class="fk">채택 형태</div><div class="fv"><b>${esc(r.form)}</b> — ${esc(f ? f.plain : '')}</div></div>
      <div class="field"><div class="fk">국내 추가 항목</div><div class="fv">${esc(r.domestic_addition || '—')}</div></div>
      <div class="field"><div class="fk">근거</div><div class="fv">${esc(r.basis)}</div></div>
      ${r.mine ? '' : `<p class="tiny" style="margin-top:8px"><a href="#/institutions/${esc(r.institution_id)}">이 제도의 카드 보기 →</a></p>`}`;
    d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }));
};

/* =========================================================
   시작
   ========================================================= */
(async () => {
  try { await loadAll(); }
  catch (e) {
    $('#loadErr').innerHTML = `<div class="err"><b>데이터 파일을 읽지 못했습니다.</b> ${esc(e.message)}<br>
      이 페이지는 <code>data/dashboard/*.json</code>을 읽어야 하므로 파일을 더블클릭해서 열면 동작하지 않습니다.
      GitHub Pages 주소로 열거나, 저장소 폴더에서 <code>python3 -m http.server 8000</code>을 실행한 뒤 <code>http://localhost:8000/dashboard.html</code>로 여세요.</div>`;
    return;
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
